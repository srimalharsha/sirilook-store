name: Deploy SIRILOOK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare premium storefront
        run: |
          mkdir -p _site
          cp -R index.html product.html admin.html track-order.html premium.css firestore.rules _site/ 2>/dev/null || true
          cp -R assets _site/ 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          if 'premium.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="./premium.css?v=1"></head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

name: Fix SIRILOOK Free Delivery Promo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[free-delivery-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Free Delivery UI
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ADMIN: one simple Free Delivery switch; fee ranges remain available
          # when Free Delivery is OFF.
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<div class="full" style="background:#fff0f6;border:2px solid #7b284f;border-radius:12px;padding:12px"><h3 style="color:#7b284f;margin:0 0 6px">🚚 මේ භාණ්ඩයේ Delivery මිල</h3>')
          end = s.find('</div><div><label>කාණ්ඩය *', start)
          if start < 0 or end < 0:
              raise SystemExit('Admin delivery section not found')
          new_section = '''<div class="full" style="background:#fff0f6;border:2px solid #7b284f;border-radius:12px;padding:14px"><h3 style="color:#7b284f;margin:0 0 8px">🚚 Delivery සැකසුම</h3><label style="display:flex;gap:10px;align-items:flex-start;margin:10px 0"><input id="freeDelivery" type="checkbox" style="width:auto;margin-top:4px"><span><strong>🎁 FREE DELIVERY</strong><br><span class="small">Tick කළොත් මේ Style එකේ website එකේ ලස්සන FREE DELIVERY promotion එක පෙන්වයි. Customerගෙන් Delivery ගාස්තුවක් අය නොවේ.</span></span></label><div id="productDeliveryFields"><p class="small" style="margin:8px 0">FREE DELIVERY Tick කර නැත්නම් පමණක් මේ Style එකේ Delivery ගාස්තුව මෙතැනින් සකසන්න.</p><label for="productBaseDeliveryFee">සාමාන්‍ය Delivery ගාස්තුව (රු.)</label><input id="productBaseDeliveryFee" type="number" min="0" step="0.01" placeholder="උදා: රු.300" style="width:100%;box-sizing:border-box"><p class="small">Quantity අනුව වෙනස් කිරීමට ranges දාන්න. උදා: 1–3 = රු.100, 4–4 = රු.200.</p><div id="productDeliveryRangeRows" style="display:grid;gap:10px;margin:12px 0"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="secondary" id="addProductDeliveryRange">＋ Quantity Range එකක් එක් කරන්න</button><button type="button" class="secondary" id="resetProductDeliveryRanges">Quantity Ranges ඉවත් කරන්න</button></div><p id="productDeliveryMessage" class="small"></p></div></div>'''
          s = s[:start] + new_section + s[end:]
          s = s.replace('$("productBaseDeliveryFee").value="";$("productDeliveryEnabled").checked=false;$("productDeliveryFields").hidden=true;$("hideDeliveryForNonCOD").checked=false;$("allowCOD").checked=true;', '$("productBaseDeliveryFee").value="";$("freeDelivery").checked=false;$("productDeliveryFields").hidden=false;')
          s = s.replace('$("productDeliveryEnabled").checked=p.deliveryFeeEnabled===true||((p.deliveryFee!==null&&p.deliveryFee!==undefined&&p.deliveryFee!=="")||(Array.isArray(p.deliveryRanges)&&p.deliveryRanges.length>0));$("productDeliveryFields").hidden=!$("productDeliveryEnabled").checked;$("hideDeliveryForNonCOD").checked=!!p.hideDeliveryForNonCOD;$("allowCOD").checked=p.allowCOD!==false;', '$("freeDelivery").checked=p.freeDelivery===true;$("productDeliveryFields").hidden=p.freeDelivery===true;')
          s = s.replace('deliveryFeeEnabled:$("productDeliveryEnabled").checked,deliveryFee:$("productDeliveryEnabled").checked&&$("productBaseDeliveryFee").value.trim()!==""?Math.max(0,Number($("productBaseDeliveryFee").value)||0):null,hideDeliveryForNonCOD:$("hideDeliveryForNonCOD").checked,allowCOD:$("allowCOD").checked,deliveryRanges:$("productDeliveryEnabled").checked?cleanProductDeliveryRanges():[],', 'freeDelivery:$("freeDelivery").checked,deliveryFeeEnabled:!$("freeDelivery").checked&&$("productBaseDeliveryFee").value.trim()!=="",deliveryFee:!$("freeDelivery").checked&&$("productBaseDeliveryFee").value.trim()!==""?Math.max(0,Number($("productBaseDeliveryFee").value)||0):null,deliveryRanges:!$("freeDelivery").checked?cleanProductDeliveryRanges():[],')
          s = s.replace('$("productDeliveryEnabled").addEventListener("change",()=>{$("productDeliveryFields").hidden=!$("productDeliveryEnabled").checked});', '$("freeDelivery").addEventListener("change",()=>{$("productDeliveryFields").hidden=$("freeDelivery").checked;});')
          p.write_text(s, encoding='utf-8')

          # PRODUCT PAGE: show a prominent badge only when freeDelivery=true;
          # never add a delivery fee when free delivery is enabled.
          p = Path('product.html')
          s = p.read_text(encoding='utf-8')
          if 'freeDeliveryBadge' not in s:
              needle = 'const actualPrice=di.active?di.price:Math.max(0,Number(p.price)||0);panel.appendChild(priceBox);'
              repl = 'const actualPrice=di.active?di.price:Math.max(0,Number(p.price)||0);panel.appendChild(priceBox);if(p.freeDelivery===true){const fd=document.createElement("div");fd.id="freeDeliveryBadge";fd.className="free-delivery-badge";fd.textContent="🚚 DELIVERY FREE";fd.style.cssText="display:flex;width:max-content;max-width:100%;margin:10px auto 14px;padding:12px 18px;font-size:18px;justify-content:center;box-shadow:0 5px 18px #16803d30;";panel.appendChild(fd);}'
              if needle not in s:
                  raise SystemExit('Product price insertion point not found')
              s = s.replace(needle, repl, 1)
          s = s.replace('const fee=p.deliveryFeeEnabled===true?styleDeliveryFee(p,1):0;', 'const fee=p.freeDelivery===true?0:(p.deliveryFeeEnabled===true?styleDeliveryFee(p,1):0);')
          s = s.replace('const deliveryFee=p.deliveryFeeEnabled===true?styleDeliveryFee(p,1):0,finalPrice=price+deliveryFee,item=', 'const deliveryFee=p.freeDelivery===true?0:(p.deliveryFeeEnabled===true?styleDeliveryFee(p,1):0),finalPrice=price+deliveryFee,item=')
          s = s.replace('deliveryFeeEnabled:p.deliveryFeeEnabled===true,allowCOD:p.allowCOD!==false,deliveryFee:', 'freeDelivery:p.freeDelivery===true,deliveryFeeEnabled:p.deliveryFeeEnabled===true,deliveryFee:')
          p.write_text(s, encoding='utf-8')

          # MAIN PAGE: add a prominent FREE DELIVERY badge to each product card
          # by using the product object's freeDelivery field in the existing card HTML.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'freeDeliveryBadge' not in s:
              markers = [
                ('const d=document.createElement("div");d.className="info";', 'const d=document.createElement("div");d.className="info";if(p.freeDelivery===true){const fd=document.createElement("div");fd.className="free-delivery-badge";fd.textContent="🚚 DELIVERY FREE";fd.style.cssText="display:flex;width:max-content;max-width:100%;margin:0 0 10px;padding:9px 13px;font-size:14px;justify-content:center;";d.appendChild(fd);}' ),
                ('d.className="info";', 'd.className="info";if(p.freeDelivery===true){const fd=document.createElement("div");fd.className="free-delivery-badge";fd.textContent="🚚 DELIVERY FREE";fd.style.cssText="display:flex;width:max-content;max-width:100%;margin:0 0 10px;padding:9px 13px;font-size:14px;justify-content:center;";d.appendChild(fd);}')
              ]
              for a,b in markers:
                  if a in s:
                      s=s.replace(a,b,1); break
              else:
                  raise SystemExit('Main page product-card insertion point not found')
              css=' .free-delivery-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#d8fbe4,#a9f0c1);color:#075d2c;border:2px solid #21a45b;border-radius:10px;padding:9px 13px;font-weight:900;font-size:14px;box-shadow:0 4px 12px #16803d25;letter-spacing:.2px}'
              s=s.replace('</style></head>',css+'</style></head>',1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html product.html index.html
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "Apply Free Delivery promotion [free-delivery-fix]"
          git push

<!doctype html>
<html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b284f"><title>Order Tracking | SIRILOOK</title><style>

import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyDhlituAgFNbUhnkmivVgcMeXUPEODNZHQ",authDomain:"sirilook-4683c.firebaseapp.com",projectId:"sirilook-4683c",storageBucket:"sirilook-4683c.firebasestorage.app",messagingSenderId:"325375844401",appId:"1:325375844401:web:ee7142002af033781c7510"},db=getFirestore(initializeApp(cfg)),form=document.getElementById("trackForm"),codeInput=document.getElementById("code"),msg=document.getElementById("message"),result=document.getElementById("result");const statuses=[["received","ඇණවුම ලැබී ඇත"],["confirmed","ඇණවුම තහවුරු කර ඇත"],["preparing","ඇඳුම සකස් කරමින් පවතී"],["shipped","ඇණවුම යවා ඇත"],["delivered","භාර දී අවසන්"],["cancelled","ඇණවුම අවලංගු කර ඇත"]];function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text||"";if(cls)n.className=cls;return n}async function track(raw){const code=raw.trim().toUpperCase();if(!/^SL-\d{6}-[A-Z0-9]{6}$/.test(code)){msg.textContent="Tracking Code එකේ ආකෘතිය වැරදියි. SL-YYMMDD-XXXXXX ආකාරයට ඇතුළත් කරන්න.";result.hidden=true;return}msg.textContent="ඇණවුම සොයමින්…";result.hidden=true;try{const snap=await getDoc(doc(db,"orders",code));if(!snap.exists()){msg.textContent="මෙම Tracking Code එකට ඇණවුමක් හමු වුණේ නැහැ. Code එක පරීක්ෂා කරන්න.";return}const o=snap.data();msg.textContent="";result.replaceChildren();result.hidden=false;result.appendChild(el("h2","ඇණවුම "+code));const s=statuses.find(x=>x[0]===o.status)||statuses[0];result.appendChild(el("p",s[1],"status"));if(o.createdAt?.toDate)result.appendChild(el("p","ඇණවුම් දිනය: "+o.createdAt.toDate().toLocaleString("si-LK"),"muted"));const steps=el("div","","steps");statuses.filter(x=>x[0]!=="cancelled").forEach(x=>{const d=el("div",x[1],"step"+(x[0]===o.status?" current":""));steps.appendChild(d)});if(o.status==="cancelled")steps.appendChild(el("div","ඇණවුම අවලංගු කර ඇත","step current"));result.appendChild(steps);result.appendChild(el("h3","භාණ්ඩ"));(Array.isArray(o.items)?o.items:[]).forEach(i=>{const row=el("div","","item");if(i.image){const im=document.createElement("img");im.src=i.image;im.alt=i.name||"SIRILOOK";row.appendChild(im)}const d=el("div","");d.appendChild(el("strong",i.name||"ඇඳුම"));d.appendChild(el("p","Style: "+(i.styleNumber||"—")+" · Colour: "+(i.color||"—")+" · Size: "+(i.size||"—")+" · Qty: "+i.qty));d.appendChild(el("p","රු. "+(Number(i.price||0)*Number(i.qty||1)).toLocaleString("en-LK")));row.appendChild(d);result.appendChild(row)});result.appendChild(el("h3","මුළු එකතුව: රු. "+Number(o.total||0).toLocaleString("en-LK")));result.appendChild(el("p","තත්ත්වය හෝ delivery විස්තර ගැන විමසීමට WhatsApp අමතන්න: +94 78 957 6303","muted"));}catch(e){msg.textContent="Order එක ලබාගැනීමට නොහැකි වුණා ("+(e.code||"error")+"). Firestore Rules publish කර තිබේද පරීක්ෂා කරන්න.";}}form.addEventListener("submit",e=>{e.preventDefault();track(codeInput.value)});const initial=new URLSearchParams(location.search).get("code");if(initial){codeInput.value=initial;track(initial)}
</script></body></html>
